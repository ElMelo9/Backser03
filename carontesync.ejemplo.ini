; Configuración de CaronteSync. Se edita desde la ventana del programa,
; o a mano con el Bloc de notas (los comentarios van en su propia línea).
; Este es un ejemplo: la ventana crea carontesync.ini la primera vez que se guarda.

[general]
; Servicio de destino: dropbox o gdrive (Google Drive).
proveedor = dropbox
; Carpeta local con los archivos a subir (por ejemplo, los respaldos de SQL Server).
origen = D:\Respaldos\SQL
; Carpeta de destino en la nube. Se crea si no existe.
carpeta_remota = /Respaldos/SQL
; Qué archivos subir, separados por ';'. Ejemplos: *.bak;*.trn  *.zip  *
patrones = *.bak;*.trn
; si = incluye las subcarpetas del origen y las recrea en la nube.
recursivo = no
; No sube archivos modificados hace menos de estos minutos: SQL Server podría estar escribiéndolos.
antiguedad_minima_minutos = 10
; si = borra el archivo local después de subirlo y verificar su suma en la nube.
borrar_local_tras_subir = no
; Tamaño de cada bloque enviado (1-128 MB). Más grande = menos pausas entre bloques, pero más memoria.
tamano_bloque_mb = 32
; Reintentos ante cortes de red o errores temporales del servicio.
reintentos = 5
; Tiempo máximo de espera de cada petición.
timeout_segundos = 120
; Certificados raíz para HTTPS (los de Windows 2003 están desactualizados). Vacío = los de Windows.
certificados = cacert.pem
; Proxy de salida, si hace falta: host:puerto  o  http://usuario:clave@host:puerto
proxy = 
archivo_log = carontesync.log
archivo_estado = estado.json
; Aquí se guarda el permiso de acceso a la cuenta: protéjalo.
archivo_tokens = tokens.json

[dropbox]
; De https://www.dropbox.com/developers/apps (pestaña Settings de su app).
app_key = 
app_secret = 

[gdrive]
; De Google Cloud Console. El cliente OAuth debe ser del tipo 'TVs y dispositivos de entrada limitada'.
client_id = 
client_secret = 

[programacion]
; si = Windows ejecuta la subida automáticamente (tarea programada).
activa = no
; diaria, semanal o horas.
frecuencia = diaria
; Hora de inicio (HH:MM, 24 horas).
hora = 03:30
; Para la frecuencia semanal: LUN,MAR,MIE,JUE,VIE,SAB,DOM
dias = LUN,MAR,MIE,JUE,VIE
; Para la frecuencia 'horas': cada cuántas horas.
cada_horas = 4
; Cuenta que ejecuta la tarea. Vacío = SYSTEM (no necesita contraseña ni que haya alguien conectado).
usuario = 
