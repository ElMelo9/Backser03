; Configuración de subir_nube.py
; Copie este archivo como subir_nube.ini (en la misma carpeta) y edítelo.
; Las rutas relativas se toman desde la carpeta donde está este archivo.
; Los comentarios van en su propia línea, empezando con ";".

[general]
; Servicio de destino: dropbox  o  gdrive (Google Drive)
proveedor = dropbox

; Carpeta local con los archivos a subir (por ejemplo, los respaldos de SQL Server).
origen = D:\Respaldos\SQL

; Carpeta de destino en la nube. Se crea si no existe.
; En Dropbox con acceso "App folder" queda dentro de /Aplicaciones/<nombre de la app>/.
carpeta_remota = /Respaldos/SQL

; Qué archivos subir, separados por ";". Ejemplos: *.bak;*.trn   *.zip   *
patrones = *.bak;*.trn

; si = incluye las subcarpetas del origen (y las recrea en la nube); no = solo la carpeta indicada.
recursivo = no

; No sube archivos modificados hace menos de estos minutos: puede que SQL Server
; todavía los esté escribiendo. Se subirán en la siguiente ejecución.
antiguedad_minima_minutos = 10

; si = borra el archivo local después de subirlo y verificar su suma en la nube.
borrar_local_tras_subir = no

; Tamaño de cada bloque enviado (1-128 MB). Bloques más grandes suben algo más
; rápido pero usan más memoria y repiten más datos si se corta la conexión.
tamano_bloque_mb = 8

; Reintentos ante cortes de red o errores temporales del servicio.
reintentos = 5
timeout_segundos = 120

; Certificados raíz para verificar HTTPS. Los de Windows 2003 están desactualizados:
; descargue https://curl.se/ca/cacert.pem en un equipo moderno y cópielo aquí.
certificados = cacert.pem

; Proxy de salida, si la red lo necesita:  host:puerto  o  http://usuario:clave@host:puerto
proxy =

archivo_log = subir_nube.log
archivo_estado = estado.json
; Aquí se guarda el permiso de acceso a la cuenta: proteja este archivo.
archivo_tokens = tokens.json

[dropbox]
; De https://www.dropbox.com/developers/apps (pestaña Settings de su app).
app_key =
app_secret =

[gdrive]
; De Google Cloud Console > APIs y servicios > Credenciales.
; El ID de cliente OAuth debe ser del tipo "TVs y dispositivos de entrada limitada".
client_id =
client_secret =
